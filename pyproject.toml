[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repro-agent"
version = "0.1.0"
description = "A paper replication agent for model-based robot control research."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "repro-agent contributors" }]
keywords = ["reproducibility", "arxiv", "model-based-rl", "llm", "openrouter"]

dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
    "gymnasium>=0.29",
    "torch>=2.2",
    "numpy>=1.26",
    "pymupdf>=1.24",
    "rich>=13.7",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
repro = "repro.cli:main"

[project.urls]
Homepage = "https://github.com/probnotas/repro-agent"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repro = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["slow: exercises the full execute stage (tens of seconds)"]
